name: Deploy to GitHub Pages

# To activate GitHub Pages hosting (one-time, repo admin):
#   1. Settings -> General -> Danger Zone -> Change visibility -> Public
#      (or stay private on a plan with private-repo Pages)
#   2. Settings -> Pages -> Source: "GitHub Actions"
# After that, every push to main deploys to https://faemse.org/ (custom
# domain set under Settings -> Pages; DNS at GoDaddy points the apex at
# GitHub Pages and www at msaco13.github.io).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Built at base "/": the site lives at the root of faemse.org. (Before
      # the custom domain it needed BASE_PATH=/faemse-website/ for the
      # msaco13.github.io project path, which now redirects here.)
      - run: npm run build
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
