name: Deploy to GitHub Pages

# NOTE: currently manual-only. GitHub Pages cannot be enabled from this
# workflow (private repo; the Actions token lacks permission to create the
# Pages site). To activate: make the repo public (or use a plan with
# private-repo Pages), enable Settings -> Pages -> Source: "GitHub Actions",
# run this workflow once, then restore the push trigger:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # GitHub Pages serves project sites from /<repo>/. Drop this env
          # (build with default base "/") when moving to a custom domain.
          BASE_PATH: /faemse-website/
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
